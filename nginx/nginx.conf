user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Same as nginx's default "combined" format, except the timestamp is $msec
    # (epoch seconds with millisecond precision) instead of $time_local, which
    # only resolves to the second. Requests arriving in the same second would
    # otherwise be unorderable once indexed.
    log_format  main_ms  '$remote_addr - $remote_user [$msec] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main_ms;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
